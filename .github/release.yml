# Categories for GitHub's generated release notes, by pull request label.
changelog:
  exclude:
    labels: [skip-changelog]
    authors: [dependabot]
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Security
      labels: [security]
    - title: New features
      labels: [enhancement]
    - title: Fixes
      labels: [bug, site-support]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
