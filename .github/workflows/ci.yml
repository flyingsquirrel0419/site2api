name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs the same checks before publishing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # engines: node >=22.12 (commander, vitest and tsup all require it)
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The record tests drive a real headless Chromium against the local demo shop.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

      # The generated spec must stay valid OpenAPI 3.1.
      - name: Lint the demo shop spec
        run: |
          node dist/cli.js from-har tests/fixtures/demo-shop.har -o out
          npx --yes @redocly/cli@1 lint out/openapi.yaml --format=summary
