openapi: 3.1.0
info:
  title: localhost (reverse-engineered)
  version: 0.0.0
  description: Generated by site2api from recorded traffic. Operation names and descriptions are heuristic until the Infer stage runs.
servers:
  - url: http://localhost:4317
paths:
  /api/cart:
    post:
      operationId: post_cart
      summary: Post cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: integer
                quantity:
                  type: integer
              required:
                - productId
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  cartId:
                    type: string
                    format: uuid
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        productId:
                          type: integer
                        quantity:
                          type: integer
                      required:
                        - productId
                        - quantity
                required:
                  - cartId
                  - items
      security:
        - cookie_sid: []
          header_x-csrf-token: []
      x-site2api:
        samples: 2
        writes: true
  /api/login:
    post:
      operationId: post_login
      summary: Post login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  user:
                    type: object
                    properties:
                      email:
                        type: string
                        format: email
                    required:
                      - email
                required:
                  - ok
                  - user
      security: []
      x-site2api:
        samples: 1
        setsCookies:
          - sid
        writes: true
  /api/orders:
    get:
      operationId: list_orders
      summary: List orders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        createdAt:
                          type: string
                          format: date-time
                        status:
                          type: string
                      required:
                        - createdAt
                        - id
                        - status
                required:
                  - orders
          links:
            GetOrder:
              operationId: get_order
              parameters:
                orderId: $response.body#/orders/0/id
              x-site2api:
                pointer: /orders/*/id
                matches: 2
                samples: 2
      security:
        - cookie_sid: []
      x-site2api:
        samples: 1
  /api/orders/{orderId}:
    get:
      operationId: get_order
      summary: Get order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  createdAt:
                    type: string
                    format: date-time
                  status:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        productId:
                          type: integer
                        quantity:
                          type: integer
                      required:
                        - productId
                        - quantity
                  shipping:
                    type: object
                    properties:
                      email:
                        type: string
                        format: email
                      phone:
                        type: string
                      note:
                        type: string
                    required:
                      - email
                      - phone
                required:
                  - createdAt
                  - id
                  - items
                  - shipping
                  - status
      security:
        - cookie_sid: []
      x-site2api:
        samples: 2
  /api/products:
    get:
      operationId: list_products
      summary: List products
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        price:
                          type: number
                        tags:
                          type: array
                          items:
                            type: string
                        discount:
                          type:
                            - "null"
                            - number
                      required:
                        - discount
                        - id
                        - name
                        - price
                        - tags
                  page:
                    type: integer
                  total:
                    type: integer
                required:
                  - items
                  - page
                  - total
      security: []
      x-site2api:
        samples: 2
  /api/products/{productId}:
    get:
      operationId: get_product
      summary: Get product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  price:
                    type: number
                  tags:
                    type: array
                    items:
                      type: string
                  discount:
                    type:
                      - "null"
                      - number
                required:
                  - discount
                  - id
                  - name
                  - price
                  - tags
      security: []
      x-site2api:
        samples: 3
  /api/session:
    get:
      operationId: get_session
      summary: Get session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
                  user:
                    type: object
                    properties:
                      email:
                        type: string
                        format: email
                    required:
                      - email
                required:
                  - csrfToken
                  - user
      security:
        - cookie_sid: []
      x-site2api:
        samples: 1
  /graphql:
    post:
      operationId: graphql_endpoint
      summary: GraphQL endpoint
      description: GraphQL endpoint. Individual operations are listed under x-site2api-graphql.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                operationName:
                  type: string
                variables:
                  type: object
              required:
                - query
      security:
        - cookie_sid: []
      x-site2api:
        graphqlEndpoint: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type:
                      - object
                      - "null"
                  errors:
                    type: array
components:
  securitySchemes:
    cookie_sid:
      type: apiKey
      in: cookie
      name: sid
    header_x-csrf-token:
      type: apiKey
      in: header
      name: x-csrf-token
x-site2api-graphql:
  - operationId: graphql_recommendations
    operationName: Recommendations
    operationType: query
    endpoint:
      method: POST
      url: http://localhost:4317/graphql
    query: "query Recommendations($limit: Int) { recommendations(limit: $limit) { id name } }"
    variables:
      type: object
      properties:
        limit:
          type: integer
      required:
        - limit
    response:
      type: object
      properties:
        data:
          type: object
          properties:
            recommendations:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                required:
                  - id
                  - name
          required:
            - recommendations
      required:
        - data
    security:
      - cookie_sid: []
    x-site2api:
      samples: 2
  - operationId: graphql_viewer
    operationName: Viewer
    operationType: query
    endpoint:
      method: POST
      url: http://localhost:4317/graphql
    query: query Viewer { viewer { email orderCount } }
    response:
      type: object
      properties:
        data:
          type: object
          properties:
            viewer:
              type: object
              properties:
                email:
                  type: string
                  format: email
                orderCount:
                  type: integer
              required:
                - email
                - orderCount
          required:
            - viewer
      required:
        - data
    security:
      - cookie_sid: []
    x-site2api:
      samples: 1
x-site2api-links:
  - from: list_orders
    status: 200
    pointer: /orders/*/id
    to: get_order
    target:
      in: path
      name: orderId
    matches: 2
    samples: 2
x-site2api-auth:
  session:
    cookies:
      - sid
    setBy:
      - post_login
  csrf:
    header: x-csrf-token
    source:
      operationId: get_session
      status: 200
      pointer: /csrfToken
