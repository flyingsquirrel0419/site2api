        var card = scope.querySelector("#s01-card");
        var rows = scope.querySelectorAll(".s01-row");
        var grid = scope.querySelector(".s01-grid");
        var words = scope.querySelectorAll(".s01-word");

        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0–1.2s): grid settles in, card springs into the upper-center
        tl.fromTo(grid, { opacity: 0 }, { opacity: 0.55, duration: 0.6, ease: "power2.out" }, 0);
        tl.fromTo(
          card,
          { scale: 0, opacity: 0, y: 24 },
          { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          0.05
        );
        // result rows pop as one arriving beat inside the card
        rows.forEach(function (el, i) {
          tl.fromTo(
            el,
            { scale: 0, opacity: 0, y: 16 },
            { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            0.45 + i * 0.06
          );
        });

        // Scene 2–3: content-aware word sequencing (pre-computed once)
        var BASE = 0.2;
        var SEC_PER_CHAR = 0.03;
        var PHASES = [
          { from: 0, to: 4, start: 1.2, end: 2.6 }, // "every website already has"
          { from: 4, to: 6, start: 2.6, end: 2.95 } // "an API." lands last
        ];
        var TIMELINE = [];
        PHASES.forEach(function (p) {
          var raw = [];
          var total = 0;
          for (var i = p.from; i < p.to; i++) {
            var d = BASE + words[i].textContent.length * SEC_PER_CHAR;
            raw.push(d);
            total += d;
          }
          var k = (p.end - p.start) / total;
          var cum = p.start;
          raw.forEach(function (d, j) {
            TIMELINE.push({ el: words[p.from + j], start: cum });
            cum += d * k;
          });
        });

        TIMELINE.forEach(function (entry) {
          var isApi = entry.el.classList.contains("s01-api");
          tl.fromTo(
            entry.el,
            { opacity: 0, y: isApi ? 0 : 28, scale: isApi ? 0.6 : 1 },
            { opacity: 1, y: 0, scale: 1, duration: isApi ? 0.45 : 0.4, ease: "power3.out" },
            entry.start
          );
        });

        // held read to the cut — pad timeline to full duration, no exit
        tl.set({}, {}, 3.5);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
