  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      "use strict";
      window.__timelines = window.__timelines || {};

      var DURATION = 2.5;
      var tl = gsap.timeline({ paused: true });

      var root = document.querySelector('[data-composition-id="05-cta"]');
      var textEl = root.querySelector("#s05-text");
      var cursorEl = root.querySelector("#s05-cursor");

      // Scene 1 (0.0-0.8s): wordmark settles, smooth register (power3.out, no overshoot)
      tl.fromTo(
        "#s05-wordmark",
        { scale: 0, opacity: 0, y: 12 },
        { scale: 1, opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
        0.05
      );

      // Scene 2 (0.8-2.0s): terminal pill grows under the wordmark
      tl.fromTo(
        "#s05-pill",
        { scaleX: 0.04, scaleY: 0.6, opacity: 0 },
        { scaleX: 1, scaleY: 1, opacity: 1, duration: 0.3, ease: "power3.out" },
        0.8
      );
      tl.fromTo(
        "#s05-pill-inner",
        { opacity: 0 },
        { opacity: 1, duration: 0.12, ease: "none" },
        1.0
      );

      // Typed command: discrete per-keystroke schedule, short pauses at word breaks
      var CMD = "npx site2api run <url>";
      var T_TYPE = 1.1;
      var STEP = 0.03;
      var SPACE_PAUSE = 0.06;
      var SEQUENCE = [{ t: 0, text: "" }];
      var tCursor = T_TYPE;
      for (var i = 0; i < CMD.length; i++) {
        SEQUENCE.push({ t: tCursor, text: CMD.slice(0, i + 1) });
        tCursor += STEP + (CMD[i] === " " ? SPACE_PAUSE : 0);
      }
      var CHANGE_TIMES = SEQUENCE.slice(1).map(function (e) {
        return e.t;
      });
      var TYPING_GRACE = 0.15;
      var CURSOR_ON_AT = 1.02;
      var BLINK_CYCLES = 5; // whole number over DURATION -> 0.5s period

      function textAt(time) {
        for (var j = SEQUENCE.length - 1; j >= 0; j--) {
          if (time >= SEQUENCE[j].t) return SEQUENCE[j].text;
        }
        return "";
      }

      // One linear driver: text state + seek-safe caret (solid while typing, square-wave blink at idle)
      var driver = { t: 0 };
      tl.fromTo(
        driver,
        { t: 0 },
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: function () {
            var now = driver.t;
            textEl.textContent = textAt(now);
            if (now < CURSOR_ON_AT) {
              cursorEl.style.opacity = "0";
              return;
            }
            var typing = CHANGE_TIMES.some(function (ct) {
              return ct <= now && now - ct < TYPING_GRACE;
            });
            var p = (Math.PI * 2 * BLINK_CYCLES * now) / DURATION;
            cursorEl.style.opacity = typing || now < T_TYPE ? "1" : Math.sin(p) > 0 ? "1" : "0";
          },
        },
        0
      );

      // Scene 3 (2.0-2.5s): quiet repo line, then hold on the blinking caret
      tl.fromTo(
        "#s05-repo",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
        2.0
      );

      window.__timelines["05-cta"] = tl;
    })();
  </script>
