    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const root = document.querySelector('[data-composition-id="03-tools"]');
        const q = (sel) => root.querySelector(sel);
        const qa = (sel) => Array.from(root.querySelectorAll(sel));
        const tl = gsap.timeline({ paused: true });

        // ── Scene 1 (0.0–1.4s): lines lift into cards — scale-swap-transition ──
        // Line row center sits at x 960 (640 + 640/2); travel lands it on its card center.
        const PAIRS = [
          { line: "#t03-line-a", card: "#t03-card-a", lineY: 760, cardX: 560 },
          { line: "#t03-line-b", card: "#t03-card-b", lineY: 820, cardX: 960 },
          { line: "#t03-line-c", card: "#t03-card-c", lineY: 880, cardX: 1360 },
        ];
        const CARD_Y = 460;
        const TRAVEL_START = 0.12;
        const STAGGER = 0.14;
        const TRAVEL_DUR = 0.62;
        const EXIT_DUR = 0.32; // outgoing shrink + fade (tail of travel)
        const OVERLAP = 0.14;
        const ENTER_DUR = 0.56;
        const EXIT_SCALE = 0.7;
        const BOUNCE = 1.6;

        PAIRS.forEach((p, i) => {
          const t0 = TRAVEL_START + i * STAGGER;
          const trigger = t0 + TRAVEL_DUR - EXIT_DUR;
          const lineEl = q(p.line);
          const cardEl = q(p.card);

          tl.fromTo(
            lineEl,
            { x: 0, y: 0 },
            { x: p.cardX - 960, y: CARD_Y - p.lineY, duration: TRAVEL_DUR, ease: "power3.inOut" },
            t0,
          );
          tl.fromTo(
            lineEl,
            { scale: 1, opacity: 1 },
            { scale: EXIT_SCALE, opacity: 0, duration: EXIT_DUR, ease: "power2.in" },
            trigger,
          );
          tl.fromTo(
            cardEl,
            { scale: EXIT_SCALE, opacity: 0 },
            { scale: 1, opacity: 1, duration: ENTER_DUR, ease: "back.out(" + BOUNCE + ")" },
            trigger + EXIT_DUR - OVERLAP,
          );
          // inner content reveals after the card settles
          const inner = Array.from(cardEl.querySelectorAll(".t03-kicker, .t03-name, .t03-meta, .t03-badge-wrap"));
          tl.fromTo(
            inner,
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.04 },
            trigger + EXIT_DUR - OVERLAP + 0.16,
          );
        });

        // ── Scene 2 (1.4–2.8s): badges flip left→right — press-release-spring (state change at release) ──
        const PRESS_DUR = 0.12;
        const RELEASE_DUR = 0.5;
        const PRESS_SCALE = 0.92;
        const CUES = [1.5, 1.9, 2.3];
        PAIRS.forEach((p, i) => {
          const cardEl = q(p.card);
          const badge = cardEl.querySelector(".t03-badge");
          const pending = cardEl.querySelector(".t03-pending");
          const done = cardEl.querySelector(".t03-done");
          const check = cardEl.querySelector(".t03-check");
          const ring = cardEl.querySelector(".t03-ring");
          const stubDone = cardEl.querySelector(".t03-stub-done");
          const press = CUES[i];
          const release = press + PRESS_DUR;

          // press (linear compression) → release (spring back), adjacent for state continuity
          tl.fromTo(badge, { scale: 1 }, { scale: PRESS_SCALE, duration: PRESS_DUR, ease: "power1.in" }, press);
          tl.to(badge, { scale: 1, duration: RELEASE_DUR, ease: "back.out(1.6)" }, release);

          // state swap at release: grey pending out, teal verified in
          tl.fromTo(pending, { opacity: 1 }, { opacity: 0, duration: 0.14, ease: "power2.in" }, release - 0.04);
          tl.fromTo(
            done,
            { opacity: 0, scale: 0.86 },
            { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.8)" },
            release,
          );
          tl.fromTo(check, { strokeDashoffset: 26 }, { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, release + 0.08);

          // flat release ring (hairline burst behind the badge)
          tl.fromTo(ring, { scale: 1, opacity: 0 }, { scale: 1.28, opacity: 0.7, duration: 0.24, ease: "power2.out" }, release);
          tl.to(ring, { opacity: 0, scale: 1.4, duration: 0.3, ease: "power2.in" }, release + 0.24);

          // card's accent stub turns teal
          tl.fromTo(stubDone, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, release);
        });

        // ── Scene 3 (2.8–4.0s): headline words sequenced — dynamic-content-sequencing ──
        const WORDS = qa(".t03-word");
        const BASE_DURATION = 0.05;
        const SEC_PER_CHAR = 0.012;
        const HEAD_START = 2.8;
        let cumulative = HEAD_START;
        const SEQ = WORDS.map((el) => {
          const start = cumulative;
          cumulative += BASE_DURATION + el.textContent.length * SEC_PER_CHAR;
          return { el, start };
        });
        SEQ.forEach((entry) => {
          tl.fromTo(
            entry.el,
            { opacity: 0, y: 28 },
            { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" },
            entry.start,
          );
        });

        // pad to full duration (hold still)
        tl.set({}, {}, 4);

        window.__timelines["03-tools"] = tl;
      })();
    </script>
