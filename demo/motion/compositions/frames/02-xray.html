    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";
        var $ = function (id) { return document.getElementById(id); };

        var CARD_LEFT = 528;
        var CARD_W = 864;

        var card = $("02-xray-card");
        var solid = $("02-xray-solid");
        var beam = $("02-xray-beam");
        var glow = $("02-xray-glow");

        var tl = gsap.timeline({ paused: true });

        /* ── Scene 1 (0.0–0.8): card already in place (handoff); beam enters at card's left edge ── */
        gsap.set(beam, { x: CARD_LEFT });
        gsap.set(glow, { x: CARD_LEFT });
        solid.style.clipPath = "inset(0px 0px 0px 0px)";
        tl.fromTo(beam, { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.2);

        /* ── Scene 2 (0.8–2.6): one long power3 sweep; wireframe behind the beam; glow travels with it ── */
        var scan = { p: 0 };
        tl.fromTo(
          scan,
          { p: 0 },
          {
            p: 1,
            duration: 1.8,
            ease: "power3.inOut",
            onUpdate: function () {
              var dx = scan.p * CARD_W;
              var x = CARD_LEFT + dx;
              gsap.set(beam, { x: x });
              gsap.set(glow, { x: x });
              solid.style.clipPath = "inset(0px 0px 0px " + dx.toFixed(2) + "px)";
            },
          },
          0.8,
        );
        // ambient-glow-bloom, traveling-sweep form: bounded to the sweep window only
        tl.fromTo(glow, { opacity: 0 }, { opacity: 0.32, duration: 0.4, ease: "power1.out" }, 0.8);
        tl.to(glow, { opacity: 0, duration: 0.4, ease: "power1.in" }, 2.2);

        /* ── Scene 3 (2.6–3.8): beam clears the card; three request lines self-draw, labels type in ── */
        tl.to(beam, { opacity: 0, scaleY: 0.2, duration: 0.3, ease: "power2.in" }, 2.6);

        var ENDPOINTS = [
          { verb: "GET ", route: "/api/search" },
          { verb: "GET ", route: "/api/orders" },
          { verb: "GET ", route: "/api/orders/{id}" },
        ];
        var DRAW_DUR = 0.42;
        var STEP = 0.34; // ~80% of the previous draw
        var LINE_START = 2.62;

        ENDPOINTS.forEach(function (ep, i) {
          var path = $("02-xray-path-" + i);
          var src = $("02-xray-src-" + i);
          var node = $("02-xray-node-" + i);
          var label = $("02-xray-label-" + i);
          var verbEl = label.getElementsByClassName("02-xray-verb")[0];
          var routeEl = label.getElementsByClassName("02-xray-route")[0];
          var len = path.getTotalLength() * 1.02;
          path.style.strokeDasharray = String(len);
          path.style.strokeDashoffset = String(len);

          var t0 = LINE_START + i * STEP;
          tl.fromTo(src, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, t0);
          tl.fromTo(path, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: DRAW_DUR, ease: "power2.out" }, t0);
          tl.fromTo(node, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, t0 + DRAW_DUR * 0.8);

          // typed label — DOM written only when the visible char count changes
          var full = ep.verb + ep.route;
          var typed = { n: 0 };
          var last = -1;
          var typeDur = Math.min(0.5, full.length * 0.026);
          tl.fromTo(
            typed,
            { n: 0 },
            {
              n: full.length,
              duration: typeDur,
              ease: "none",
              onUpdate: function () {
                var c = Math.round(typed.n);
                if (c === last) return;
                last = c;
                var s = full.slice(0, c);
                verbEl.textContent = s.slice(0, ep.verb.length);
                routeEl.textContent = s.slice(ep.verb.length);
              },
            },
            t0 + DRAW_DUR * 0.85,
          );
        });

        /* ── Scene 4 (3.8–4.5): headline reveals top-left; card defocuses so the endpoints lead ── */
        // dynamic-content-sequencing: per-word starts computed from word length
        var words = Array.prototype.slice.call(document.getElementById("02-xray-headline").getElementsByClassName("02-xray-word"));
        var HEAD_START = 3.8;
        var BASE = 0.06;
        var SEC_PER_CHAR = 0.018;
        var cursor = HEAD_START;
        words.forEach(function (w) {
          tl.fromTo(w, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, cursor);
          cursor += BASE + w.textContent.length * SEC_PER_CHAR;
        });

        // depth-of-field-blur, focal pull on the card only
        tl.fromTo(card, { "--dof": "0px", opacity: 1 }, { "--dof": "4px", opacity: 0.55, duration: 0.6, ease: "power2.inOut" }, 3.8);

        // hold to the end of the frame
        tl.to({}, { duration: 0.01 }, 4.49);

        tl.seek(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["02-xray"] = tl;
      })();
