    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";
        var root = document.querySelector('[data-composition-id="04-agent"]');
        var q = function (s) { return root.querySelectorAll(s); };

        var cards = q(".f04-agent-card");
        var edges = q(".f04-agent-card-edge");
        var wires = q(".f04-agent-wire");
        var lits = q(".f04-agent-wire-lit");
        var beams = q(".f04-agent-beam");
        var pips = q(".f04-agent-pip-on");
        var words = q(".f04-agent-word");
        var hub = root.querySelector(".f04-agent-hub");
        var halo = root.querySelector(".f04-agent-halo");
        var fill = root.querySelector(".f04-agent-fill");
        var pulse = root.querySelector(".f04-agent-pulse");

        // geometry: handoff row -> triangle ring around the hub
        var HUB = { x: 960, y: 470 };
        var ROW = [{ x: 560, y: 460 }, { x: 960, y: 460 }, { x: 1360, y: 460 }];
        var RING = [{ x: 470, y: 600 }, { x: 960, y: 175 }, { x: 1450, y: 600 }];
        var RING_SCALE = 0.72;

        var tl = gsap.timeline({ paused: true });

        // ---- Scene 1 (0.0-1.0): hub rises, cards row -> ring ----
        tl.fromTo(
          hub,
          { xPercent: -50, yPercent: -50, x: HUB.x, y: HUB.y + 70, scale: 0.6, opacity: 0 },
          { x: HUB.x, y: HUB.y, scale: 1, opacity: 1, duration: 0.6, ease: "power3.out" },
          0.12
        );
        tl.fromTo(halo, { opacity: 0, scale: 0.8 }, { opacity: 0.18, scale: 1, duration: 0.6, ease: "power2.out" }, 0.2);

        for (var i = 0; i < 3; i += 1) {
          tl.fromTo(
            cards[i],
            { xPercent: -50, yPercent: -50, x: ROW[i].x, y: ROW[i].y, scale: 1, opacity: 1 },
            { x: RING[i].x, y: RING[i].y, scale: RING_SCALE, duration: 0.85, ease: "power3.out" },
            0.05 + i * 0.06
          );
        }

        // ---- Scene 2 (1.0-2.4): connectors draw, beam travels each into the hub ----
        var STEP_HALO = [0.42, 0.66, 0.95];
        var STEP_FILL = [0.08, 0.16, 0.26];
        for (var j = 0; j < 3; j += 1) {
          var wl = wires[j].getTotalLength();
          wires[j].style.strokeDasharray = wl + " " + wl;
          tl.fromTo(wires[j], { strokeDashoffset: wl }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 0.95 + j * 0.08);

          var bl = beams[j].getTotalLength();
          var dash = bl * 0.3;
          beams[j].style.strokeDasharray = dash + " " + (bl + dash);
          var start = 1.1 + j * 0.42;
          var arrive = start + 0.5;
          tl.fromTo(
            beams[j],
            { strokeDashoffset: dash },
            { strokeDashoffset: -bl, duration: 0.58, ease: "sine.inOut" },
            start
          );
          // source card lights as the beam leaves it
          tl.fromTo(edges[j], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, start);
          // connector stays lit behind the beam
          tl.fromTo(lits[j], { opacity: 0 }, { opacity: 0.9, duration: 0.3, ease: "power2.out" }, start + 0.15);
          // hub brightens a step on arrival
          tl.to(halo, { opacity: STEP_HALO[j], duration: 0.25, ease: "power2.out" }, arrive);
          tl.to(fill, { opacity: STEP_FILL[j], duration: 0.25, ease: "power2.out" }, arrive);
          tl.fromTo(pips[j], { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, arrive);
          tl.to(hub, { scale: 1.045, duration: 0.1, ease: "power2.out" }, arrive);
          tl.to(hub, { scale: 1, duration: 0.25, ease: "power2.out" }, arrive + 0.1);
        }

        // the agent pulses once after the final arrival
        var PULSE_AT = 2.45;
        tl.to(hub, { scale: 1.08, duration: 0.14, ease: "power2.out" }, PULSE_AT);
        tl.to(hub, { scale: 1, duration: 0.4, ease: "power3.out" }, PULSE_AT + 0.14);
        tl.fromTo(pulse, { opacity: 0.85, scale: 1 }, { opacity: 0, scale: 1.75, duration: 0.8, ease: "power2.out" }, PULSE_AT);

        // ---- Scene 3 (2.4-3.5): payoff line reveals under the hub, then hold ----
        tl.fromTo(
          words,
          { opacity: 0, y: 34 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.06 },
          2.5
        );
        // subtle hold drift (no loop)
        tl.fromTo(hub, { y: HUB.y }, { y: HUB.y - 5, duration: 0.9, ease: "sine.inOut", immediateRender: false }, 2.6);

        window.__timelines = window.__timelines || {};
        window.__timelines["04-agent"] = tl;
      })();
