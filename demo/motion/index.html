<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0d14; /* frame.md ink-black: the assembler took "cream" (broadside's text color) for the canvas */
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-dcwt"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18"
      data-width="1920"
      data-height="1080"
    >
      <div data-hf-id="hf-tmbl"
        id="el-01-secret"
        class="scene"
        data-composition-id="01-secret"
        data-composition-src="compositions/frames/01-secret.html"
        data-start="0"
        data-duration="3.5"
        data-track-index="0"
      ></div>

      <div data-hf-id="hf-48yk"
        id="el-02-xray"
        class="scene"
        data-composition-id="02-xray"
        data-composition-src="compositions/frames/02-xray.html"
        data-start="3.5"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div data-hf-id="hf-wyoc"
        id="el-03-tools"
        class="scene"
        data-composition-id="03-tools"
        data-composition-src="compositions/frames/03-tools.html"
        data-start="8"
        data-duration="4"
        data-track-index="0"
      ></div>

      <div data-hf-id="hf-5bfd"
        id="el-04-agent"
        class="scene"
        data-composition-id="04-agent"
        data-composition-src="compositions/frames/04-agent.html"
        data-start="12"
        data-duration="3.9"
        data-track-index="1"
      ></div>

      <div data-hf-id="hf-fsbn"
        id="el-05-cta"
        class="scene"
        data-composition-id="05-cta"
        data-composition-src="compositions/frames/05-cta.html"
        data-start="15.5"
        data-duration="2.5"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-04-agent", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 15.5);
        tl.fromTo("#el-05-cta", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 15.5);
        tl.to({}, { duration: 18 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
